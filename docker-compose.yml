services:
  rental-scout:
    build: .
    container_name: rental-scout
    restart: unless-stopped
    env_file: .env
    environment:
      # node-cron runs the 6am-6pm hourly check in this timezone.
      - TZ=${TZ:-America/Chicago}
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
